<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List Produktivitas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#f9a8d4,#c084fc,#60a5fa);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .container{
      width:100%;
      max-width:950px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.3);
      border-radius:30px;
      padding:35px;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
      color:white;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:38px;
      font-weight:700;
    }

    .header p{
      opacity:0.8;
      margin-top:5px;
    }

    .logout-btn{
      background:linear-gradient(135deg,#dc2626,#f43f5e);
      padding:12px 22px;
      border-radius:14px;
      color:white;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .logout-btn:hover{
      transform:scale(1.05);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      padding:25px;
      border-radius:25px;
      color:white;
      position:relative;
      overflow:hidden;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card::before{
      content:'';
      position:absolute;
      width:120px;
      height:120px;
      background:rgba(255,255,255,0.15);
      border-radius:50%;
      top:-40px;
      right:-40px;
    }

    .blue{
      background:linear-gradient(135deg,#2563eb,#60a5fa);
    }

    .green{
      background:linear-gradient(135deg,#16a34a,#4ade80);
    }

    .red{
      background:linear-gradient(135deg,#dc2626,#fb7185);
    }

    .card h2{
      font-size:18px;
      font-weight:500;
      margin-bottom:10px;
    }

    .card h1{
      font-size:40px;
    }

    .input-group{
      display:flex;
      gap:15px;
      margin-bottom:30px;
    }

    input{
      flex:1;
      padding:16px;
      border:none;
      border-radius:18px;
      outline:none;
      font-size:16px;
      background:rgba(255,255,255,0.9);
    }

    .btn-add{
      padding:16px 25px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn-add:hover{
      transform:scale(1.05);
    }

    .task{
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(255,255,255,0.2);
      padding:20px;
      border-radius:22px;
      margin-bottom:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:0.3s;
    }

    .task:hover{
      transform:translateY(-3px);
      background:rgba(255,255,255,0.25);
    }

    .task h3{
      font-size:20px;
      margin-bottom:8px;
    }

    .status{
      display:inline-block;
      padding:6px 14px;
      border-radius:30px;
      font-size:13px;
      font-weight:600;
    }

    .belum{
      background:#fee2e2;
      color:#dc2626;
    }

    .selesai{
      background:#dcfce7;
      color:#15803d;
    }

    .actions{
      display:flex;
      gap:10px;
    }

    .btn-done{
      background:linear-gradient(135deg,#16a34a,#22c55e);
      border:none;
      color:white;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
    }

    .btn-delete{
      background:linear-gradient(135deg,#dc2626,#f43f5e);
      border:none;
      color:white;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
    }

    .empty{
      text-align:center;
      padding:40px;
      opacity:0.8;
      font-size:18px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div>
        <h1>✨ To-Do List Produktivitas</h1>
        <p>Kelola tugas harianmu dengan lebih modern</p>
      </div>

      <a href="/logout" class="logout-btn">
        Logout
      </a>

    </div>

    <div class="stats">

      <div class="card blue">
        <h2>Total Tugas</h2>
        <h1 id="total">0</h1>
      </div>

      <div class="card green">
        <h2>Selesai</h2>
        <h1 id="done">0</h1>
      </div>

      <div class="card red">
        <h2>Belum</h2>
        <h1 id="pending">0</h1>
      </div>

    </div>

    <div class="input-group">

      <input
        type="text"
        id="taskInput"
        placeholder="Masukkan tugas baru..."
      >

      <button
        class="btn-add"
        onclick="addTask()"
      >
        Tambah
      </button>

    </div>

    <div id="taskList"></div>

  </div>

<script>

let tasks = [];

async function loadTasks() {

  const res = await fetch('/tasks');

  tasks = await res.json();

  renderTasks();
}

function renderTasks() {

  const taskList = document.getElementById('taskList');

  taskList.innerHTML = '';

  let done = 0;

  if(tasks.length === 0){

    taskList.innerHTML = `
      <div class="empty">
        📌 Belum ada tugas
      </div>
    `;
  }

  tasks.forEach((task, index) => {

    if(task.done) done++;

    taskList.innerHTML += `

      <div class="task">

        <div>

          <h3>${task.text}</h3>

          <span class="status ${task.done ? 'selesai' : 'belum'}">
            ${task.done ? 'Selesai' : 'Belum'}
          </span>

        </div>

        <div class="actions">

          <button
            class="btn-done"
            onclick="completeTask(${index})"
          >
            ✔ Selesai
          </button>

          <button
            class="btn-delete"
            onclick="deleteTask(${index})"
          >
            ✖ Hapus
          </button>

        </div>

      </div>

    `;
  });

  document.getElementById('total').innerText = tasks.length;

  document.getElementById('done').innerText = done;

  document.getElementById('pending').innerText =
    tasks.length - done;
}

async function addTask() {

  const input = document.getElementById('taskInput');

  if(input.value.trim() === '') {
    return;
  }

  await fetch('/tasks', {

    method:'POST',

    headers:{
      'Content-Type':'application/json'
    },

    body:JSON.stringify({
      text:input.value
    })

  });

  input.value='';

  loadTasks();
}

async function completeTask(index){

  const task = tasks[index];

  await fetch(`/tasks/${task.id}`, {
    method: 'PUT'
  });

  loadTasks();
}

async function deleteTask(index){

  const task = tasks[index];

  await fetch(`/tasks/${task.id}`, {
    method:'DELETE'
  });

  loadTasks();
}

loadTasks();

</script>

</body>
</html>
