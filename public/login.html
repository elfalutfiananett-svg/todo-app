<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login To-Do List</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #df9ac1,
        #8fa8ff
    );
}

.login-box{

    width:420px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.3);

    border-radius:25px;

    padding:40px;

    box-shadow:0 8px 30px rgba(0,0,0,0.15);

}

h1{

    color:white;

    margin-bottom:10px;

    font-size:40px;

}

p{

    color:#f3f4f6;

    margin-bottom:30px;

}

.input-group{

    margin-bottom:20px;

}

input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    outline:none;

    font-size:16px;

    background:white;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    background:linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

button:hover{

    transform:scale(1.03);

}

.info{

    margin-top:20px;

    text-align:center;

    color:white;

    font-size:14px;

}

</style>
</head>

<body>

<div class="login-box">

    <h1>✨ Login User</h1>

    <p>Masuk ke aplikasi To-Do List Produktivitas</p>

    <div class="input-group">

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

    </div>

    <div class="input-group">

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

    </div>

    <button onclick="login()">
        Login
    </button>

    <div class="info">
        Username: admin | Password: 123
    </div>

</div>

<script>

async function login(){

    const username =
    document.getElementById('username').value;

    const password =
    document.getElementById('password').value;

    const res = await fetch('/login',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            username,
            password
        })

    });

    const data = await res.json();

    if(data.success){


        window.location.href='/';

    }else{

        alert('Username atau password salah');

    }

}

</script>

</body>
</html>
